<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AXON Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
background:#050505;
color:white;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.box{

background:#111;
padding:40px;
border-radius:10px;
width:300px;

}

input{

width:100%;
padding:10px;
margin:10px 0;
background:#000;
border:1px solid #333;
color:white;

}

button{

width:100%;
padding:10px;
background:#d4af37;
border:none;
cursor:pointer;
font-weight:bold;

}

a{
color:#d4af37;
cursor:pointer;
}

</style>

</head>

<body>

<div class="box">

<h2>AXON</h2>

<input id="email" placeholder="Email">

<input id="senha" type="password" placeholder="Senha">

<button onclick="login()">Entrar</button>

<p>Não tem conta? <a onclick="registro()">Criar conta</a></p>

</div>

<script>

const SUPABASE_URL = "https://zqvfnykxwlcozvawqgrn.supabase.co"

const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpxdmZueWt4d2xjb3p2YXdxZ3JuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk3NDkzNDQsImV4cCI6MjA4NTMyNTM0NH0.CevpF9vP4748mb2vFNsOp5Kq6u7Nfp_100bJcW7ogUQ"

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

async function login(){

const email = document.getElementById("email").value
const senha = document.getElementById("senha").value

const { error } = await supabaseClient.auth.signInWithPassword({
email:email,
password:senha
})

if(error){

alert(error.message)

}else{

window.location.href="index.html"

}

}

async function registro(){

const email = document.getElementById("email").value
const senha = document.getElementById("senha").value

const { error } = await supabaseClient.auth.signUp({
email:email,
password:senha
})

if(error){

alert(error.message)

}else{

alert("Conta criada! Agora faça login.")

}

}

</script>

</body>
</html>
